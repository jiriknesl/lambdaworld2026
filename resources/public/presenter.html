<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="presentation-build" content="local"><title>Lambda World · Presenter</title><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/presenter.css"></head>
